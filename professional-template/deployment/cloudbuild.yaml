# Google Cloud Build configuration for automatic CI/CD deployments
# This file enables automatic deployments when you push to your main branch

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/[your-app-name]:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/[your-app-name]:latest'
      - '.'
    timeout: 1200s

  # Push the container image to Container Registry (with commit SHA)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/[your-app-name]:$COMMIT_SHA'

  # Push the container image to Container Registry (latest tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/[your-app-name]:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '[your-app-name]'
      - '--image'
      - 'gcr.io/$PROJECT_ID/[your-app-name]:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      # Add environment variables here if needed:
      # - '--set-env-vars'
      # - 'NEXT_PUBLIC_GA_MEASUREMENT_ID=G-XXXXXXXXXX,NEXT_PUBLIC_ADSENSE_CLIENT_ID=ca-pub-XXXXXXXXXXXXXXXX'

# Specify which images to store
images:
  - 'gcr.io/$PROJECT_ID/[your-app-name]:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/[your-app-name]:latest'

# Overall timeout for the build
timeout: 1800s

# CUSTOMIZATION REQUIRED:
# Replace all instances of [your-app-name] with your actual app name (lowercase, no spaces)
# Example: my-converter-app, epl-editor, pdf-tool, etc.

